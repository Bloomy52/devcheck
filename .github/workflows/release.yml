name: Release Gem

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Publish to RubyGems
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby
          bundler-cache: true

      - name: Publish gem
        uses: rubygems/release-gem@v1
